name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API（lint + 测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: Ruff 检查（lint）
        run: ruff check .
      - name: Ruff 格式检查
        run: ruff format --check .
      - name: 语法编译检查
        run: python -m compileall app tests
      - name: 单元测试
        run: pytest -q

  web:
    name: Web（构建 + 类型检查）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖
        run: npm install
      - name: 构建（含 TypeScript 类型检查）
        run: npm run build